name: Construir ejecutable de Windows

# Se puede lanzar a mano desde la pestaña "Actions" de GitHub (botón
# "Run workflow"), o automáticamente cada vez que subas cambios a main.
on:
  workflow_dispatch:
  push:
    branches: [main]
    # Los cambios que solo tocan las pruebas no cambian el programa:
    # no hace falta reconstruir el .exe por ellos.
    paths-ignore:
      - "pruebas/probar_interfaz.py"
      - "pruebas/capturas.py"
      - ".github/workflows/probar-interfaz.yml"

# Necesario para publicar los resultados en la rama "resultados-exe".
permissions:
  contents: write

concurrency:
  group: build-windows

jobs:
  build:
    # Esto es lo que resuelve "no tengo un PC con Windows": GitHub nos
    # presta una máquina Windows real, solo para este trabajo, gratis.
    runs-on: windows-latest

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar las dependencias del proyecto y PyInstaller
        run: |
          pip install -r requirements.txt -c restricciones.txt
          pip install pyinstaller==6.22.3 -c restricciones.txt

      - name: Construir el ejecutable
        # --paths modulos: para que encuentre inventario.py, servicios.py...
        # --hidden-import: PyInstaller no siempre detecta solo los imports
        #   que dependen de sys.path.append(), así que los listamos a mano.
        #   google_drive_backup es un caso especial: se importa dentro de
        #   un try/except (main.py/app.py), y PyInstaller suele no detectar
        #   bien los imports "escondidos" así -- por eso, además de
        #   listarlo, incluimos sus propias dependencias con --collect-all
        #   (más agresivo que --hidden-import: mete también archivos de
        #   datos internos que estas librerías de Google necesitan).
        # --add-data "app.py;.": incluye una copia SUELTA de app.py (no solo
        #   compilada), porque Streamlit necesita el archivo de verdad.
        # --console (sin --windowed, a propósito): dejamos la ventana negra
        #   visible por ahora, para poder ver errores si algo falla. Se
        #   puede ocultar más adelante una vez esté todo probado.
        run: >
          pyinstaller --onefile --console --name GestionRestaurante
          --paths modulos
          --hidden-import inventario
          --hidden-import servicios
          --hidden-import recetario
          --hidden-import compras
          --hidden-import dashboard
          --hidden-import exportador
          --hidden-import persistencia
          --hidden-import metricas
          --hidden-import gastos
          --hidden-import materiales
          --hidden-import historial
          --hidden-import elaboraciones
          --hidden-import google_drive_backup
          --collect-all google_auth_oauthlib
          --collect-all googleapiclient
          --collect-all google_auth_httplib2
          --collect-all google
          --add-data "app.py;."
          --add-data ".streamlit;.streamlit"
          --collect-all streamlit
          iniciar_app.py

      # Probar el .exe de verdad, como lo usaría el cliente: arrancarlo,
      # abrir todas las páginas, guardar, exportar, cerrarlo y reabrirlo.
      # Ver pruebas/probar_exe.py.
      - name: Instalar el navegador para probar el .exe
        run: |
          pip install playwright==1.63.0 -c restricciones.txt
          python -m playwright install chromium

      - name: Probar el .exe
        id: prueba_exe
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
        run: python pruebas/probar_exe.py dist/GestionRestaurante.exe

      # Igual que en probar-interfaz.yml: los resultados se publican en una
      # rama aparte (solo guarda los de la ÚLTIMA ejecución).
      - name: Publicar resultados en la rama "resultados-exe"
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p resultados
          cp -r resultados /tmp/publicar
          cd /tmp/publicar
          {
            echo "Resultados de la prueba del .exe del cambio ${GITHUB_SHA}"
            echo "Prueba del .exe: ${{ steps.prueba_exe.outcome }}"
          } > LEEME.txt
          git init -q -b resultados-exe
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Resultados de la prueba del .exe de ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:resultados-exe

      # Solo se ofrece la descarga si el .exe ha pasado la prueba: así
      # nunca se entrega por error un ejecutable que no funciona.
      - name: Subir el .exe como descarga
        if: steps.prueba_exe.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: GestionRestaurante-Windows
          path: dist/GestionRestaurante.exe

      - name: Marcar la ejecución como fallida si el .exe no pasó la prueba
        if: steps.prueba_exe.outcome != 'success'
        run: |
          echo "El .exe no ha pasado la prueba: revisa resultado_exe.txt en la rama resultados-exe."
          exit 1
