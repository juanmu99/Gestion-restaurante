name: Revision temporal
on:
  push:
    branches: [revision-temporal]
permissions:
  contents: write
jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -c restricciones.txt
      - run: |
          mkdir -p resultados
          python pruebas/revision_temporal.py 2>&1 | tee resultados/revision.txt || true
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp -r resultados /tmp/pub && cd /tmp/pub
          git init -q -b resultados-revision
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "revision"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:resultados-revision
